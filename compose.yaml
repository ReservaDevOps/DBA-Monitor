services:
  dba-evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: dba_monitor_evolution_api
    restart: unless-stopped
    depends_on:
      - dba-evolution-redis
      - dba-evolution-postgres
    ports:
      - "127.0.0.1:18080:8080"
    env_file:
      - ./environment/evolution/evolution.env
    volumes:
      - ./environment/evolution/instances:/evolution/instances
    networks:
      - monitor-notifications

  dba-evolution-redis:
    image: redis:latest
    container_name: dba_monitor_evolution_redis
    restart: unless-stopped
    command: >
      redis-server --port 6379 --appendonly yes
    volumes:
      - dba_evolution_redis:/data
    networks:
      monitor-notifications:
        aliases:
          - dba-evolution-redis

  dba-evolution-postgres:
    image: postgres:15
    container_name: dba_monitor_evolution_postgres
    restart: unless-stopped
    env_file:
      - ./environment/evolution/evolution.env
    volumes:
      - dba_evolution_postgres_data:/var/lib/postgresql/data
      - ./environment/evolution/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      monitor-notifications:
        aliases:
          - dba-evolution-postgres

  vpn-client-a:
    build:
      context: .
      dockerfile: docker/vpn/Dockerfile
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "127.0.0.1:18081:8080"
    volumes:
      - ./environment/vpn/client-a:/vpn:ro
    networks:
      - monitor-notifications
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ip link show tun0 >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 12

  agent-client-a:
    build:
      context: .
      dockerfile: docker/agent/Dockerfile
    network_mode: "service:vpn-client-a"
    restart: unless-stopped
    depends_on:
      vpn-client-a:
        condition: service_healthy
      dba-evolution-api:
        condition: service_started
    env_file:
      - ./environment/db/client-a.env
    volumes:
      - ./data/client-a:/data
      - ./reports:/reports
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      STATUS_INTERVAL_SECONDS: 300
      DAILY_REPORT_HOUR: 2
      DAILY_REPORT_MINUTE: 0
      MAX_DATABASES_PER_REPORT: 0
      REQUIRE_API_TOKEN: "true"
      RUN_STATUS_ON_STARTUP: "true"
      REPORT_NAME: client-a
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5

  vpn-client-b:
    profiles:
      - client-b
    build:
      context: .
      dockerfile: docker/vpn/Dockerfile
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "127.0.0.1:18082:8080"
    volumes:
      - ./environment/vpn/client-b:/vpn:ro
    networks:
      - monitor-notifications
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ip link show tun0 >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 12

  agent-client-b:
    profiles:
      - client-b
    build:
      context: .
      dockerfile: docker/agent/Dockerfile
    network_mode: "service:vpn-client-b"
    restart: unless-stopped
    depends_on:
      vpn-client-b:
        condition: service_healthy
      dba-evolution-api:
        condition: service_started
    env_file:
      - ./environment/db/client-b.env
    volumes:
      - ./data/client-b:/data
      - ./reports:/reports
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      STATUS_INTERVAL_SECONDS: 300
      DAILY_REPORT_HOUR: 2
      DAILY_REPORT_MINUTE: 0
      MAX_DATABASES_PER_REPORT: 0
      REQUIRE_API_TOKEN: "true"
      RUN_STATUS_ON_STARTUP: "true"
      REPORT_NAME: client-b
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  dba_evolution_postgres_data:
  dba_evolution_redis:

networks:
  monitor-notifications:
    name: dba-monitor-notifications
    driver: bridge
